<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>altacloset — your local stylist</title>
<style>
  :root { --bg:#0f1216; --card:#181d24; --line:#262d36; --txt:#e8ecf1; --mut:#9aa7b4; --acc:#4f9cf9; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:20px; margin:0; }
  header span { color:var(--mut); font-size:13px; }
  main { max-width:960px; margin:0 auto; padding:24px; display:grid; gap:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card h2 { margin:0 0 12px; font-size:15px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  select, input[type=text], input[type=password], input[type=file], button { padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:#0f1216; color:var(--txt); font-size:14px; }
  button { background:var(--acc); border:none; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  #weather { display:flex; gap:16px; flex-wrap:wrap; }
  #weather b { font-size:26px; }
  .cond { color:var(--mut); }
  .garment { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); }
  .garment:last-child { border-bottom:none; }
  .swatch { width:22px; height:22px; border-radius:6px; border:1px solid var(--line); flex:none; }
  .garment .role { width:90px; color:var(--mut); font-size:12px; text-transform:uppercase; flex:none; }
  .garment .name { flex:1; }
  ul#reasons { color:var(--mut); padding-left:18px; margin:8px 0 0; }
  #result img { max-width:100%; border-radius:10px; border:1px solid var(--line); }
  #webcam { max-width:100%; border-radius:10px; border:1px solid var(--line); background:#000; }
  .muted { color:var(--mut); font-size:13px; }
</style>
</head>
<body>
<header><h1>altacloset</h1><span>local AI stylist</span><button id="signout-btn" hidden style="margin-left:auto">Sign out</button></header>
<main>

  <section class="card" id="auth-card">
    <h2>Account</h2>
    <div class="row">
      <input type="text" id="auth-user" placeholder="username" autocomplete="username" />
      <input type="password" id="auth-pass" placeholder="password (8+ chars)" autocomplete="current-password" />
      <button id="auth-login">Log in</button>
      <button id="auth-register">Register</button>
      <span class="muted" id="auth-status"></span>
    </div>
  </section>

  <div id="app" hidden>
  <section class="card">
    <h2>Weather</h2>
    <div id="weather"><span class="muted">loading…</span></div>
  </section>

  <section class="card">
    <h2>What's the occasion?</h2>
    <div class="row">
      <select id="activity">
        <option value="casual">Casual / errands</option>
        <option value="office" selected>Office / work</option>
        <option value="date">Date / dinner</option>
        <option value="hiking">Hiking / active</option>
        <option value="beach">Beach</option>
        <option value="formal">Wedding / formal</option>
      </select>
      <input type="text" id="prompt" placeholder="style hint (e.g. navy, casual, wool…)" style="flex:1" />
      <button id="recommend-btn">Recommend outfit</button>
    </div>
    <div id="outfit"></div>
    <ul id="reasons"></ul>
  </section>

  <section class="card">
    <h2>Try it on</h2>
    <p class="muted">Put the recommended top on a photo — upload one, or capture from webcam. (Phase 2: requires ComfyUI + CatVTON running.)</p>
    <div class="row">
      <select id="garment-select"></select>
      <label class="muted">person photo: <input type="file" id="person-file" accept="image/*" /></label>
      <button id="webcam-btn">Capture from webcam</button>
      <button id="tryon-btn">Try on</button>
    </div>
    <video id="webcam" hidden playsinline></video>
    <div id="result" style="margin-top:12px"></div>
  </section>
  </div>

</main>

<script>
const $ = (id) => document.getElementById(id);
const TOKEN_KEY = 'altacloset_token';

// ---------- auth ----------
function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }

// fetch wrapper that adds the bearer token and handles session expiry
async function api(path, opts = {}) {
  const headers = new Headers(opts.headers || {});
  const token = getToken();
  if (token) headers.set('Authorization', 'Bearer ' + token);
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401 && path !== '/api/auth/login' && path !== '/api/auth/register') {
    setToken(null); showAuth();
    $('auth-status').textContent = 'session expired — log in again';
    throw new Error('session expired');
  }
  return res;
}

async function authAction(endpoint) {
  const body = { username: $('auth-user').value.trim(), password: $('auth-pass').value };
  const res = await fetch('/api/auth/' + endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) { $('auth-status').textContent = (await res.json()).detail || 'error'; return; }
  const data = await res.json();
  setToken(data.token);
  $('auth-status').textContent = 'signed in as ' + data.user.username;
  $('auth-pass').value = '';
  enterApp();
}

$('auth-login').addEventListener('click', () => authAction('login'));
$('auth-register').addEventListener('click', () => authAction('register'));
$('auth-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') authAction('login'); });
$('signout-btn').addEventListener('click', () => { setToken(null); showAuth(); });

function showAuth() {
  $('auth-card').hidden = false;
  $('app').hidden = true;
  $('signout-btn').hidden = true;
}
function enterApp() {
  $('auth-card').hidden = true;
  $('app').hidden = false;
  $('signout-btn').hidden = false;
  loadWeather();
  populateGarments(null);
}

// ---------- weather ----------
async function loadWeather() {
  try {
    const res = await api('/api/weather');
    if (!res.ok) throw new Error('http ' + res.status);
    const w = await res.json();
    $('weather').innerHTML =
      `<b>${w.feels_like_c ?? w.temp_c}°C</b>` +
      `<span class="cond">${w.condition}</span>` +
      `<span class="cond">wind ${w.wind_kph} km/h</span>` +
      `<span class="cond">humidity ${w.humidity}%</span>`;
  } catch (e) { $('weather').innerHTML = '<span class="muted">weather unavailable</span>'; }
}

// ---------- recommend ----------
let lastOutfit = null;

$('recommend-btn').addEventListener('click', async () => {
  const btn = $('recommend-btn'); btn.disabled = true;
  try {
    const res = await api('/api/recommend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ activity: $('activity').value, prompt: $('prompt').value || null }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    lastOutfit = data.outfit;
    renderOutfit(data.outfit);
    $('reasons').innerHTML = (data.reasoning || []).map((r) => `<li>${r}</li>`).join('');
    populateGarments(data.outfit);
  } catch (e) { alert('recommend failed: ' + e); }
  finally { btn.disabled = false; }
});

function renderOutfit(outfit) {
  const order = [['top','Top'], ['bottom','Bottom'], ['outerwear','Outer'], ['footwear','Shoes']];
  let html = '';
  for (const [key, label] of order) {
    const g = outfit[key];
    if (!g) continue;
    html += `<div class="garment"><span class="role">${label}</span>` +
            `<span class="swatch" style="background:${g.color_hex || '#888'}"></span>` +
            `<span class="name">${g.name}</span></div>`;
  }
  (outfit.accessories || []).forEach((g) => {
    html += `<div class="garment"><span class="role">Acc</span>` +
            `<span class="swatch" style="background:${g.color_hex || '#888'}"></span>` +
            `<span class="name">${g.name}</span></div>`;
  });
  $('outfit').innerHTML = html || '<p class="muted">no outfit — wardrobe empty?</p>';
}

function populateGarments(outfit) {
  const top = outfit && outfit.top;
  const sel = $('garment-select');
  sel.innerHTML = '';
  if (top) sel.add(new Option(`${top.name} (recommended #${top.id})`, top.id));
  api('/api/wardrobe').then((r) => r.json()).then((items) => {
    items.filter((g) => g.category === 'top' || g.category === 'dress').forEach((g) => {
      if (!top || g.id !== top.id) sel.add(new Option(g.name, g.id));
    });
  }).catch(() => {});
}

// ---------- try on ----------
$('tryon-btn').addEventListener('click', async () => {
  const file = $('person-file').files[0];
  if (!file) { alert('pick a person photo first (or capture from webcam)'); return; }
  const fd = new FormData();
  fd.append('garment_id', $('garment-select').value);
  fd.append('person', file);
  const btn = $('tryon-btn'); btn.disabled = true;
  $('result').innerHTML = '<p class="muted">rendering… (Phase 2 needs ComfyUI+CatVTON; can take ~20s)</p>';
  try {
    const res = await api('/api/tryon', { method: 'POST', body: fd });
    if (!res.ok) { $('result').innerHTML = `<p class="muted">try-on failed: ${await res.text()}</p>`; return; }
    const data = await res.json();
    // result images are private → fetch as blob with our token, then show it
    const imgRes = await api(data.result_url);
    const blob = await imgRes.blob();
    $('result').innerHTML = '';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(blob);
    $('result').appendChild(img);
  } catch (e) { $('result').innerHTML = `<p class="muted">error: ${e}</p>`; }
  finally { btn.disabled = false; }
});

// ---------- webcam capture ----------
let stream = null;
$('webcam-btn').addEventListener('click', async () => {
  const video = $('webcam');
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; video.hidden = true; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream; video.hidden = false; await video.play();
    $('webcam-btn').textContent = 'Stop webcam';
  } catch (e) { alert('webcam unavailable: ' + e); }
});

// click the preview to capture a frame into the file input
$('webcam').addEventListener('click', () => {
  if (!stream) return;
  const canvas = document.createElement('canvas');
  const MAX = 1024;
  const scale = Math.min(MAX / $('webcam').videoWidth, 1);
  canvas.width = Math.round($('webcam').videoWidth * scale);
  canvas.height = Math.round($('webcam').videoHeight * scale);
  canvas.getContext('2d').drawImage($('webcam'), 0, 0, canvas.width, canvas.height);
  canvas.toBlob((blob) => {
    const dt = new DataTransfer();
    dt.items.add(new File([blob], 'webcam.jpg', { type: 'image/jpeg' }));
    $('person-file').files = dt.files;
    $('webcam-btn').textContent = 'Capture from webcam';
    stream.getTracks().forEach((t) => t.stop()); stream = null; $('webcam').hidden = true;
  }, 'image/jpeg', 0.92);
});

// ---------- boot ----------
if (getToken()) enterApp(); else showAuth();
</script>
</body>
</html>
