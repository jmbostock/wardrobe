<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>{% block title %}Clueless Closet{% endblock %}</title>
<!-- PWA / home-screen -->
<meta name="theme-color" content="#0f1216" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Closet" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/static/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="/static/css/app.css" />
</head>
<body data-require-auth="{{ 'true' if active != 'auth' else 'false' }}" class="{{ 'auth-page' if active == 'auth' else '' }}">
{% if active != 'auth' %}
<header>
  <nav>
    <a href="/suggest" class="{{ 'active' if active == 'suggest' }}">Suggest</a>
    <a href="/tryon" class="{{ 'active' if active == 'tryon' }}">Try on</a>
    <a href="/wardrobe" class="{{ 'active' if active == 'wardrobe' }}">Wardrobe</a>
    <a href="/outfits" class="{{ 'active' if active == 'outfits' }}">Outfits</a>
    <a href="/account" class="{{ 'active' if active == 'account' }}">Account</a>
  </nav>
</header>
{% endif %}
<main>
  {% block content %}{% endblock %}
  <footer class="app-version muted">Clueless Closet v{{ version }}</footer>
</main>
<div class="toast" id="toast"></div>
<div id="lightbox" class="sheet" hidden>
  <div class="panel">
    <div class="grab"></div>
    <div class="head">
      <h2>Photo</h2>
      <button id="lightbox-close" class="ghost close" aria-label="Close">✕</button>
    </div>
    <div class="img-wrap"><img id="lightbox-img" alt="" /></div>
  </div>
</div>
{% block modals %}{% endblock %}
<script src="/static/js/common.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
