{% extends 'base.html' %}
{% block title %}Suggest — {{ page_title }}{% endblock %}
{% block content %}
<section id="view-suggest">

  <!-- Cher chat IS the suggest tab. No static compose bar / occasion select —
       everything happens IN the thread: suggested-prompt chips render as the
       last item in the chat, tap one and the look is built right there. -->
  <div class="card chat-card suggest-chat-card">
    <div class="chat-header">
      <span class="chat-title">✦ Cher</span>
      <button id="chat-clear" class="ghost small" title="New conversation">↺ New chat</button>
    </div>

    <div id="chat-messages" class="chat-messages">
      <div class="chat-bubble assistant intro-bubble">
        <span class="bubble-text">Hi! I'm Cher, your personal stylist. Tap an occasion below (or just ask me anything) and I'll put together a look right here.</span>
      </div>
    </div>

    <div class="chat-input-row" id="chat-input-row">
      <textarea id="chat-input" class="chat-textarea" placeholder="Ask Cher anything…" rows="1"></textarea>
      <button id="chat-send" class="chat-send-btn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div id="chat-status" class="chat-status muted small"></div>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/suggest.js"></script>{% endblock %}
