<div id="edit-modal" hidden data-edit-mode="{{ edit_mode }}">
  <div class="modal">
    <div class="modal-head">
      <h2 id="edit-title">Edit</h2>
      <button id="edit-close" class="ghost">✕</button>
    </div>
    {% if edit_mode == 'garment' %}
    <div id="edit-garment-fields">
      <img id="edit-img" alt="" />
      <div class="block">
        <label>Photo — upload a file or set it from a link</label>
        <div class="row">
          <input type="file" id="edit-file" accept="image/*" hidden />
          <button id="edit-upload" class="ghost">Upload photo</button>
        </div>
        <div class="row">
          <input type="text" id="edit-url" placeholder="https://… image URL" class="field" />
          <button id="edit-url-btn" class="ghost">Set from link</button>
        </div>
      </div>
      <div class="row">
        <div class="block" style="flex:1;min-width:0"><label>Category</label><select id="edit-category"></select></div>
        <div class="block" style="flex:1;min-width:0"><label>Color</label><input type="text" id="edit-color" class="field" placeholder="e.g. navy" /></div>
      </div>
    </div>
    {% endif %}
    <div class="block">
      <label>Name</label>
      <input type="text" id="edit-name" class="field" placeholder="name" />
    </div>
    <div class="block">
      <label>Rating <span class="muted">(out of 10)</span></label>
      <div class="rate" id="edit-rating"></div>
      <div class="muted" id="edit-rating-val"></div>
    </div>
    <div class="row">
      <button id="edit-save">Save</button>
      <button id="edit-delete" class="danger">Delete</button>
      <span class="muted" id="edit-status"></span>
    </div>
  </div>
</div>
