# cluelesscloset — Docker stack
# Tested host: 10.0.1.202 (RTX 5060 Ti 16GB, toolkit 1.12.1, Docker 29.4.1)
# Migration: identical compose works on the target machine (same GPU); see PLAN.md §7.

name: cluelesscloset

services:
  webapp:
    build: ./services/webapp
    image: cluelesscloset-webapp:local
    container_name: cluelesscloset-webapp
    restart: unless-stopped
    env_file: .env
    environment:
      - HF_HOME=/models/huggingface
      - COMFYUI_URL=${COMFYUI_URL:-http://comfyui:8188}
      - OLLAMA_URL=http://ollama:11434
      # opt-in renderer selection (see app/config.py TRYON_MODELS).
      # "qwen_edit" is the only wired renderer since the CatVTON / IDM-VTON
      # stack was removed (2026-09-23).
      - TRYON_MODELS=${TRYON_MODELS:-qwen_edit}
    volumes:
      - ./data/wardrobe:/data/wardrobe
      - ./data/uploads:/data/uploads
      - ./data/db:/data/db
      - models:/models
    ports:
      - "${WEBAPP_BIND:-127.0.0.1}:${WEBAPP_PORT:-28082}:8000"
    networks: [cluelesscloset]

  # The `comfyui` service that used to live here built ComfyUI + CatVTON
  # (services/comfyui/Dockerfile) as the try-on renderer. It was removed on
  # 2026-09-23 with the CatVTON / IDM-VTON stack: rendering now happens on the
  # Qwen-Image-2.1 ComfyUI instance, which is NOT managed by this compose file
  # (it needs ComfyUI >= 0.37 + ComfyUI-GGUF and lives on the GPU host — see
  # QWEN_COMFYUI_URL in .env).
  #
  # COMFYUI_URL is still read by app/svd.py (motion clips) and app/editor.py
  # (legacy /api/tryon/edit). Both are optional and neither is wired into the
  # UI any more, so if you keep them you'll need to point COMFYUI_URL at a
  # plain ComfyUI yourself.

  ollama:
    # Phase 3 (LLM stylist). GPU service, enabled with: docker compose --profile gpu up -d
    profiles: ["gpu"]
    image: ollama/ollama:latest
    container_name: cluelesscloset-ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=2m
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-28114}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [cluelesscloset]

volumes:
  models:

networks:
  cluelesscloset:
